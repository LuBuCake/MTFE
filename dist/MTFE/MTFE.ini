[Loader]
; 0 = load nothing (the dinput8.dll proxy keeps working)
bEnablePlugins=1
; also load <game>\plugins\*.dll (plain DLLs of the old Plugin Loader), now after the game is unpacked
bLoadLegacyPlugins=1
; close Capcom's Launcher.exe once the game runs (on Windows 10/11 it waits for a key forever and Steam keeps
; the game as running)
bCloseLauncher=1

[Debug]
; open a console window with the MTFE log
bConsole=0

[Resources]
; mod folders (like the GTA SA modloader): <game>\MTFE\Mods\<any mod name>\... replaces game files
; without touching the originals. An .arc is matched by name, anywhere in the mod; any other file by its game path
; (pawn\, stage\, effect\... - a nativePC_MT\ prefix is fine). A loose file also wins over the same file inside
; an .arc. Conflicts: the mod folder that sorts last wins. A folder starting with '-' is disabled.
bModFolders=1
; log every mod file that replaces an archive entry to Logs\mtfe.log (failures are always logged)
bLogModFiles=1

[Menu]
; Extras > Special Settings > MODS: the settings pages of the plugins (saved in MTFE\Config\<plugin>.ini, never in the save)
bModsMenu=1
