[Loader]
; 0 = load nothing (the dinput8.dll proxy keeps working)
bEnablePlugins=1
; also load the plugins of the old RE5 Plugin Loader (<game>\plugins\*.dll)
bLoadLegacyPlugins=1
; close Capcom's Launcher.exe once the game runs (otherwise Steam keeps showing the game as running)
bCloseLauncher=1

[Debug]
; open a console window with the MTFE log
bConsole=0

[Resources]
; mod folders: the files of <game>\MTFE\Mods\<mod name>\ replace the game's files without touching the originals.
; An .arc is matched by name; any other file by its game path (pawn\, stage\, effect\...). When two mods have the
; same file, the folder that comes last in alphabetical order wins. A folder whose name starts with '-' is disabled.
bModFolders=1
; log every mod file used to Logs\mtfe.log (errors are always logged)
bLogModFiles=1

[Menu]
; Extras > Special Settings > MODS: the settings pages of the plugins (saved in MTFE\Config\<plugin>.ini)
bModsMenu=1
